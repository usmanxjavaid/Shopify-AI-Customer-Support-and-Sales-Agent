<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velvora Support Chat — Test Widget</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

    :root {
        --v-navy: #101B2D;
        --v-navy-light: #1B2C45;
        --v-teal: #1FC6C6;
        --v-amber: #FF8F4D;
        --v-ice: #F5FAFB;
        --v-slate: #64748B;
        --v-border: #E2E8F0;
    }

    #velvora-chat-bubble {
        position: fixed; bottom: 22px; right: 22px; width: 60px; height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--v-navy) 0%, var(--v-navy-light) 60%, var(--v-teal) 130%);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        box-shadow: 0 6px 20px rgba(16,27,45,0.35);
        z-index: 9999; transition: transform 0.18s ease, box-shadow 0.18s ease;
        border: none;
    }
    #velvora-chat-bubble:hover { box-shadow: 0 8px 26px rgba(16,27,45,0.45); }
    #velvora-chat-bubble svg { color: #fff; }

    #velvora-chat-window {
        position: fixed; bottom: 94px; right: 22px; width: 380px; max-width: 92vw;
        height: 560px; max-height: 74vh; background: var(--v-ice);
        border-radius: 20px; box-shadow: 0 14px 44px rgba(16,27,45,0.28);
        z-index: 9999; display: none; flex-direction: column; overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif; border: 1px solid var(--v-border);
    }
    #velvora-chat-window.open { display: flex; }

    #velvora-chat-header {
        background: linear-gradient(115deg, var(--v-navy) 0%, var(--v-navy-light) 55%, #3a3050 85%, var(--v-amber) 145%);
        color: white; padding: 16px 16px 16px 14px;
        display: flex; align-items: center; justify-content: space-between;
        flex-shrink: 0;
    }
    #velvora-brand { display: flex; align-items: center; gap: 10px; }
    #velvora-mark {
        width: 34px; height: 34px; border-radius: 10px;
        background: rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    #velvora-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    #velvora-brand-name {
        font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.2px;
    }
    #velvora-brand-status {
        font-size: 11.5px; color: rgba(255,255,255,0.72); display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    #velvora-status-dot {
        width: 6px; height: 6px; border-radius: 50%; background: #3DDC97; display: inline-block;
        box-shadow: 0 0 0 2px rgba(61,220,151,0.25);
    }
    #velvora-header-actions { display: flex; align-items: center; gap: 4px; }
    .velvora-icon-btn {
        width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; background: transparent; border: none;
        transition: background 0.15s ease;
    }
    .velvora-icon-btn:hover { background: rgba(255,255,255,0.14); }

    #velvora-chat-messages {
        flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 12px;
    }
    #velvora-chat-messages::-webkit-scrollbar { width: 6px; }
    #velvora-chat-messages::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    .velvora-row { display: flex; }
    .velvora-row.user { justify-content: flex-end; }
    .velvora-row.agent { justify-content: flex-start; }

    .velvora-message {
        padding: 10px 14px; border-radius: 16px; max-width: 78%;
        line-height: 1.45; white-space: pre-wrap; font-size: 13.5px;
    }
    .velvora-user-message {
        background: var(--v-navy); color: white; border-bottom-right-radius: 4px;
    }
    .velvora-agent-message {
        background: white; color: #1E293B; border: 1px solid var(--v-border);
        border-bottom-left-radius: 4px;
    }
    .velvora-message audio { display: block; margin-top: 8px; width: 100%; height: 32px; }

    #velvora-typing {
        display: none; align-items: center; gap: 4px; padding: 10px 14px;
        background: white; border: 1px solid var(--v-border); border-radius: 16px;
        border-bottom-left-radius: 4px; width: fit-content;
    }
    #velvora-typing.show { display: flex; }
    .velvora-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--v-slate);
        animation: velvora-bounce 1.2s infinite ease-in-out;
    }
    .velvora-dot:nth-child(2) { animation-delay: 0.15s; }
    .velvora-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes velvora-bounce { 0%,60%,100% { opacity: 0.35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    #velvora-chat-input-area {
        display: flex; align-items: center; border-top: 1px solid var(--v-border);
        padding: 12px; gap: 8px; background: white; flex-shrink: 0;
    }
    #velvora-chat-input {
        flex: 1; border: 1px solid var(--v-border); border-radius: 22px; padding: 10px 16px;
        font-size: 13.5px; outline: none; font-family: inherit; background: var(--v-ice);
        transition: border-color 0.15s ease;
    }
    #velvora-chat-input:focus { border-color: var(--v-teal); }

    #velvora-chat-send, #velvora-chat-mic {
        background: var(--v-navy); color: white; border: none; border-radius: 50%;
        width: 38px; height: 38px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s ease;
    }
    #velvora-chat-send:hover { background: var(--v-teal); }
    #velvora-chat-mic.recording { background: var(--v-amber); animation: velvora-pulse 1s infinite; }
    @keyframes velvora-pulse {
        0% { box-shadow: 0 0 0 0 rgba(255,143,77,0.5); }
        70% { box-shadow: 0 0 0 9px rgba(255,143,77,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,143,77,0); }
    }
</style>

<div id="velvora-chat-bubble" onclick="velvoraToggleChat()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10.5H16M8 14.5H13M21 12C21 16.9706 16.9706 21 12 21C10.4818 21 9.05074 20.6221 7.79654 19.9556L3 21L4.39366 16.8033C3.5157 15.4467 3 13.7893 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</div>
</div>

<div id="velvora-chat-window">
    <div id="velvora-chat-header">
        <div id="velvora-brand">
            <div id="velvora-mark">
                <svg width="22" height="22" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="356" cy="168" r="34" fill="#FF8F4D"/>
                    <path d="M96 336 L206 176 L268 262 L232 300 L96 336 Z" fill="rgba(255,255,255,0.25)"/>
                    <path d="M118 356 L246 168 L338 300 L292 300 L246 236 L188 320 L118 356 Z" fill="#1FC6C6"/>
                    <path d="M246 168 L268 200 L246 214 L224 200 Z" fill="#F5FAFB"/>
                    <rect x="96" y="356" width="320" height="10" rx="5" fill="#F5FAFB" opacity="0.9"/>
                </svg>
            </div>
            <div id="velvora-brand-text">
                <span id="velvora-brand-name">Velvora Support</span>
                <span id="velvora-brand-status"><span id="velvora-status-dot"></span>Online now</span>
            </div>
        </div>
        <div id="velvora-header-actions">
            <button class="velvora-icon-btn" onclick="velvoraNewConversation()" title="Start new conversation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4v5h5M20 20v-5h-5M4.5 15a8 8 0 0014.5 3.5M19.5 9a8 8 0 00-14.5-3.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="velvora-icon-btn" onclick="velvoraToggleChat()" title="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="velvora-chat-messages"></div>
    <div id="velvora-chat-input-area">
        <button id="velvora-chat-mic" onclick="velvoraToggleRecording()" title="Record voice message">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="white" stroke-width="1.8"/>
                <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>
        <input type="text" id="velvora-chat-input" placeholder="Type a message..." />
        <button id="velvora-chat-send" onclick="velvoraSendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const VELVORA_API_BASE = "https://REPLACE_WITH_YOUR_DEPLOYED_URL";
    let velvoraSessionId = "web_" + Math.random().toString(36).substring(2, 15);
    let velvoraChatOpen = false;
    let velvoraMediaRecorder = null;
    let velvoraAudioChunks = [];
    let velvoraIsRecording = false;

    function velvoraToggleChat() {
        velvoraChatOpen = !velvoraChatOpen;
        document.getElementById("velvora-chat-window").classList.toggle("open", velvoraChatOpen);
        if (velvoraChatOpen && document.getElementById("velvora-chat-messages").children.length === 0) {
            velvoraAddMessage("Hi! I'm Velvora's support assistant. Type or use the mic to talk to me.", false);
        }
    }

    function velvoraNewConversation() {
        velvoraSessionId = "web_" + Math.random().toString(36).substring(2, 15);
        document.getElementById("velvora-chat-messages").innerHTML = "";
        velvoraAddMessage("Started a new conversation. How can I help?", false);
    }

    function velvoraAddMessage(text, isUser, audioUrl) {
        const messagesEl = document.getElementById("velvora-chat-messages");
        const row = document.createElement("div");
        row.className = "velvora-row " + (isUser ? "user" : "agent");
        const bubble = document.createElement("div");
        bubble.className = "velvora-message " + (isUser ? "velvora-user-message" : "velvora-agent-message");
        bubble.textContent = text;
        if (audioUrl) {
            const audioEl = document.createElement("audio");
            audioEl.src = audioUrl;
            audioEl.controls = true;
            bubble.appendChild(audioEl);
        }
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function velvoraShowTyping(show) {
        let typingRow = document.getElementById("velvora-typing-row");
        const messagesEl = document.getElementById("velvora-chat-messages");
        if (show) {
            if (!typingRow) {
                typingRow = document.createElement("div");
                typingRow.className = "velvora-row agent";
                typingRow.id = "velvora-typing-row";
                typingRow.innerHTML = '<div id="velvora-typing" class="show"><span class="velvora-dot"></span><span class="velvora-dot"></span><span class="velvora-dot"></span></div>';
                messagesEl.appendChild(typingRow);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        } else if (typingRow) {
            typingRow.remove();
        }
    }

    async function velvoraSendMessage() {
        const inputEl = document.getElementById("velvora-chat-input");
        const text = inputEl.value.trim();
        if (!text) return;

        velvoraAddMessage(text, true);
        inputEl.value = "";
        velvoraShowTyping(true);

        try {
            const response = await fetch(VELVORA_API_BASE + "/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: velvoraSessionId, text: text }),
            });
            const data = await response.json();
            velvoraShowTyping(false);
            velvoraAddMessage(data.reply, false);
        } catch (error) {
            velvoraShowTyping(false);
            velvoraAddMessage("Sorry, something went wrong. Please try again.", false);
            console.error(error);
        }
    }

    async function velvoraToggleRecording() {
        if (velvoraIsRecording) {
            velvoraMediaRecorder.stop();
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            velvoraMediaRecorder = new MediaRecorder(stream);
            velvoraAudioChunks = [];
            velvoraMediaRecorder.ondataavailable = (e) => velvoraAudioChunks.push(e.data);
            velvoraMediaRecorder.onstop = velvoraHandleRecordingStop;
            velvoraMediaRecorder.start();
            velvoraIsRecording = true;
            document.getElementById("velvora-chat-mic").classList.add("recording");
        } catch (err) {
            velvoraAddMessage("Microphone access denied or unavailable.", false);
            console.error(err);
        }
    }

    async function velvoraHandleRecordingStop() {
        document.getElementById("velvora-chat-mic").classList.remove("recording");
        velvoraIsRecording = false;

        const audioBlob = new Blob(velvoraAudioChunks, { type: "audio/webm" });
        velvoraAddMessage("🎤 Voice message sent", true);
        velvoraShowTyping(true);

        const formData = new FormData();
        formData.append("audio", audioBlob, "voice.webm");

        try {
            const response = await fetch(
                VELVORA_API_BASE + "/api/chat/voice?session_id=" + velvoraSessionId,
                { method: "POST", body: formData }
            );
            const replyTextB64 = response.headers.get("X-Reply-Text");
            const replyText = replyTextB64 ? decodeURIComponent(escape(atob(replyTextB64))) : "(voice reply)";
            const replyBlob = await response.blob();
            const audioUrl = URL.createObjectURL(replyBlob);
            velvoraShowTyping(false);
            velvoraAddMessage(replyText, false, audioUrl);
        } catch (error) {
            velvoraShowTyping(false);
            velvoraAddMessage("Sorry, something went wrong with the voice message.", false);
            console.error(error);
        }
    }

    document.getElementById("velvora-chat-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") velvoraSendMessage();
    });
</script>
</body>
</html>
