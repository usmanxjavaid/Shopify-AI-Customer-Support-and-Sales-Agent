<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velvora Support Chat — Test Widget</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

    :root {
        --v-navy: #101B2D;
        --v-navy-light: #1B2C45;
        --v-teal: #1FC6C6;
        --v-amber: #FF8F4D;
        --v-ice: #F5FAFB;
        --v-slate: #64748B;
        --v-border: #E2E8F0;
    }

    #velvora-chat-bubble {
        position: fixed; bottom: 22px; right: 22px; width: 60px; height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--v-navy) 0%, var(--v-navy-light) 60%, var(--v-teal) 130%);
        display: flex; align-items: center; justify-content: center; cursor: pointer;
        box-shadow: 0 6px 20px rgba(16,27,45,0.35);
        z-index: 9999; transition: transform 0.18s ease, box-shadow 0.18s ease;
        border: none;
    }
    #velvora-chat-bubble:hover { box-shadow: 0 8px 26px rgba(16,27,45,0.45); }
    #velvora-chat-bubble svg { color: #fff; }

    #velvora-chat-window {
        position: fixed; bottom: 94px; right: 22px; width: 380px; max-width: 92vw;
        height: 560px; max-height: 74vh; background: var(--v-ice);
        border-radius: 20px; box-shadow: 0 14px 44px rgba(16,27,45,0.28);
        z-index: 9999; display: none; flex-direction: column; overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif; border: 1px solid var(--v-border);
    }
    #velvora-chat-window.open { display: flex; }

    #velvora-chat-header {
        background: linear-gradient(115deg, var(--v-navy) 0%, var(--v-navy-light) 55%, #3a3050 85%, var(--v-amber) 145%);
        color: white; padding: 16px 16px 16px 14px;
        display: flex; align-items: center; justify-content: space-between;
        flex-shrink: 0;
    }
    #velvora-brand { display: flex; align-items: center; gap: 10px; }
    #velvora-mark {
        width: 34px; height: 34px; border-radius: 10px;
        background: rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
    }
    #velvora-brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    #velvora-brand-name {
        font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.2px;
    }
    #velvora-brand-status {
        font-size: 11.5px; color: rgba(255,255,255,0.72); display: flex; align-items: center; gap: 5px; margin-top: 2px;
    }
    #velvora-status-dot {
        width: 6px; height: 6px; border-radius: 50%; background: #3DDC97; display: inline-block;
        box-shadow: 0 0 0 2px rgba(61,220,151,0.25);
    }
    #velvora-header-actions { display: flex; align-items: center; gap: 4px; }
    .velvora-icon-btn {
        width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; background: transparent; border: none;
        transition: background 0.15s ease;
    }
    .velvora-icon-btn:hover { background: rgba(255,255,255,0.14); }

    #velvora-chat-messages {
        flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 12px;
    }
    #velvora-chat-messages::-webkit-scrollbar { width: 6px; }
    #velvora-chat-messages::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

    .velvora-row { display: flex; flex-direction: column; }
    .velvora-row.user { align-items: flex-end; }
    .velvora-row.agent { align-items: flex-start; }

    .velvora-message {
        padding: 10px 14px; border-radius: 16px; max-width: 82%;
        line-height: 1.45; font-size: 13.5px;
    }
    .velvora-user-message {
        background: var(--v-navy); color: white; border-bottom-right-radius: 4px;
    }
    .velvora-agent-message {
        background: white; color: #1E293B; border: 1px solid var(--v-border);
        border-bottom-left-radius: 4px;
    }
    .velvora-message strong { font-weight: 700; }

    .velvora-caption {
        font-size: 11px; color: var(--v-slate); margin: 3px 4px 0; max-width: 82%;
    }

    /* Custom audio player bubble */
    .velvora-audio-bubble {
        display: flex; align-items: center; gap: 10px; padding: 9px 12px;
        border-radius: 16px; max-width: 82%; min-width: 190px;
    }
    .velvora-audio-bubble.user { background: var(--v-navy); border-bottom-right-radius: 4px; }
    .velvora-audio-bubble.agent { background: white; border: 1px solid var(--v-border); border-bottom-left-radius: 4px; }
    .velvora-play-btn {
        width: 30px; height: 30px; border-radius: 50%; border: none; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .velvora-audio-bubble.user .velvora-play-btn { background: rgba(255,255,255,0.18); color: white; }
    .velvora-audio-bubble.agent .velvora-play-btn { background: var(--v-ice); color: var(--v-navy); }
    .velvora-audio-track {
        flex: 1; height: 4px; border-radius: 2px; position: relative; cursor: pointer;
    }
    .velvora-audio-bubble.user .velvora-audio-track { background: rgba(255,255,255,0.25); }
    .velvora-audio-bubble.agent .velvora-audio-track { background: var(--v-border); }
    .velvora-audio-progress {
        position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; width: 0%;
    }
    .velvora-audio-bubble.user .velvora-audio-progress { background: var(--v-teal); }
    .velvora-audio-bubble.agent .velvora-audio-progress { background: var(--v-teal); }
    .velvora-audio-time {
        font-size: 10.5px; flex-shrink: 0; min-width: 32px; text-align: right;
    }
    .velvora-audio-bubble.user .velvora-audio-time { color: rgba(255,255,255,0.75); }
    .velvora-audio-bubble.agent .velvora-audio-time { color: var(--v-slate); }

    #velvora-typing {
        display: flex; align-items: center; gap: 4px; padding: 10px 14px;
        background: white; border: 1px solid var(--v-border); border-radius: 16px;
        border-bottom-left-radius: 4px; width: fit-content;
    }
    .velvora-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--v-slate);
        animation: velvora-bounce 1.2s infinite ease-in-out;
    }
    .velvora-dot:nth-child(2) { animation-delay: 0.15s; }
    .velvora-dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes velvora-bounce { 0%,60%,100% { opacity: 0.35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

    #velvora-chat-input-area {
        display: flex; align-items: center; border-top: 1px solid var(--v-border);
        padding: 12px; gap: 8px; background: white; flex-shrink: 0;
    }
    #velvora-chat-input {
        flex: 1; border: 1px solid var(--v-border); border-radius: 22px; padding: 10px 16px;
        font-size: 13.5px; outline: none; font-family: inherit; background: var(--v-ice);
        transition: border-color 0.15s ease;
    }
    #velvora-chat-input:focus { border-color: var(--v-teal); }

    #velvora-chat-send, #velvora-chat-mic {
        background: var(--v-navy); color: white; border: none; border-radius: 50%;
        width: 38px; height: 38px; display: flex; align-items: center;
        justify-content: center; cursor: pointer; flex-shrink: 0; transition: background 0.15s ease;
    }
    #velvora-chat-send:hover { background: var(--v-teal); }

    /* Recording bar replaces input area while recording */
    #velvora-recording-bar {
        display: none; align-items: center; gap: 10px; border-top: 1px solid var(--v-border);
        padding: 12px; background: white; flex-shrink: 0;
    }
    #velvora-recording-bar.active { display: flex; }
    #velvora-chat-input-area.hidden { display: none; }
    #velvora-rec-dot {
        width: 10px; height: 10px; border-radius: 50%; background: #E11D48; flex-shrink: 0;
        animation: velvora-rec-blink 1s infinite;
    }
    @keyframes velvora-rec-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    #velvora-rec-timer { font-size: 13px; color: var(--v-navy); font-weight: 600; flex-shrink: 0; min-width: 36px; }
    #velvora-rec-bars { flex: 1; display: flex; align-items: center; gap: 2px; height: 24px; overflow: hidden; }
    .velvora-rec-bar { width: 3px; border-radius: 2px; background: var(--v-teal); min-height: 3px; transition: height 0.08s ease; }
    .velvora-rec-btn {
        width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #velvora-rec-cancel { background: var(--v-ice); color: var(--v-slate); }
    #velvora-rec-send { background: var(--v-teal); color: white; }
</style>

<div id="velvora-chat-bubble" onclick="velvoraToggleChat()">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 10.5H16M8 14.5H13M21 12C21 16.9706 16.9706 21 12 21C10.4818 21 9.05074 20.6221 7.79654 19.9556L3 21L4.39366 16.8033C3.5157 15.4467 3 13.7893 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</div>

<div id="velvora-chat-window">
    <div id="velvora-chat-header">
        <div id="velvora-brand">
            <div id="velvora-mark">
                <svg width="22" height="22" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="356" cy="168" r="34" fill="#FF8F4D"/>
                    <path d="M96 336 L206 176 L268 262 L232 300 L96 336 Z" fill="rgba(255,255,255,0.25)"/>
                    <path d="M118 356 L246 168 L338 300 L292 300 L246 236 L188 320 L118 356 Z" fill="#1FC6C6"/>
                    <path d="M246 168 L268 200 L246 214 L224 200 Z" fill="#F5FAFB"/>
                    <rect x="96" y="356" width="320" height="10" rx="5" fill="#F5FAFB" opacity="0.9"/>
                </svg>
            </div>
            <div id="velvora-brand-text">
                <span id="velvora-brand-name">Velvora Support</span>
                <span id="velvora-brand-status"><span id="velvora-status-dot"></span>AI Assistant · Always online</span>
            </div>
        </div>
        <div id="velvora-header-actions">
            <button class="velvora-icon-btn" onclick="velvoraNewConversation()" title="Start new conversation">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4v5h5M20 20v-5h-5M4.5 15a8 8 0 0014.5 3.5M19.5 9a8 8 0 00-14.5-3.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="velvora-icon-btn" onclick="velvoraToggleChat()" title="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="velvora-chat-messages"></div>

    <div id="velvora-chat-input-area">
        <button id="velvora-chat-mic" onclick="velvoraStartRecording()" title="Record voice message">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="white" stroke-width="1.8"/>
                <path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </button>
        <input type="text" id="velvora-chat-input" placeholder="Type a message..." />
        <button id="velvora-chat-send" onclick="velvoraSendMessage()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>

    <div id="velvora-recording-bar">
        <span id="velvora-rec-dot"></span>
        <span id="velvora-rec-timer">0:00</span>
        <div id="velvora-rec-bars"></div>
        <button class="velvora-rec-btn" id="velvora-rec-cancel" onclick="velvoraCancelRecording()" title="Cancel">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="velvora-rec-btn" id="velvora-rec-send" onclick="velvoraStopAndSendRecording()" title="Send">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </div>
</div>

<script>
    const VELVORA_API_BASE = "https://REPLACE_WITH_YOUR_DEPLOYED_URL";
    let velvoraSessionId = "web_" + Math.random().toString(36).substring(2, 15);
    let velvoraChatOpen = false;

    // --- Recording state ---
    let velvoraMediaRecorder = null;
    let velvoraAudioChunks = [];
    let velvoraRecStream = null;
    let velvoraAudioCtx = null;
    let velvoraAnalyser = null;
    let velvoraRecTimerInterval = null;
    let velvoraRecSeconds = 0;
    let velvoraRecCancelled = false;
    const VELVORA_BAR_COUNT = 28;

    function velvoraToggleChat() {
        velvoraChatOpen = !velvoraChatOpen;
        document.getElementById("velvora-chat-window").classList.toggle("open", velvoraChatOpen);
        if (velvoraChatOpen && document.getElementById("velvora-chat-messages").children.length === 0) {
            velvoraAddText("Hi! I'm Velvora's support assistant. Type or use the mic to talk to me.", false);
        }
    }

    function velvoraNewConversation() {
        velvoraSessionId = "web_" + Math.random().toString(36).substring(2, 15);
        document.getElementById("velvora-chat-messages").innerHTML = "";
        velvoraAddText("Started a new conversation. How can I help?", false);
    }

    // --- Minimal, safe markdown rendering (bold only) ---
    function velvoraRenderMarkdown(text) {
        const escaped = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        return escaped
            .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/\n/g, "<br>");
    }

    function velvoraAddText(text, isUser) {
        const messagesEl = document.getElementById("velvora-chat-messages");
        const row = document.createElement("div");
        row.className = "velvora-row " + (isUser ? "user" : "agent");
        const bubble = document.createElement("div");
        bubble.className = "velvora-message " + (isUser ? "velvora-user-message" : "velvora-agent-message");
        if (isUser) {
            bubble.textContent = text;
        } else {
            bubble.innerHTML = velvoraRenderMarkdown(text);
        }
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return row;
    }

    function velvoraAddCaption(text, isUser, afterRow) {
        const caption = document.createElement("div");
        caption.className = "velvora-caption";
        caption.style.alignSelf = isUser ? "flex-end" : "flex-start";
        caption.textContent = text;
        afterRow.appendChild(caption);
        document.getElementById("velvora-chat-messages").scrollTop = document.getElementById("velvora-chat-messages").scrollHeight;
    }

    // --- Custom audio player ---
    function velvoraFormatTime(sec) {
        if (!isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
    }

    function velvoraAddAudioBubble(audioUrl, isUser) {
        const messagesEl = document.getElementById("velvora-chat-messages");
        const row = document.createElement("div");
        row.className = "velvora-row " + (isUser ? "user" : "agent");

        const bubble = document.createElement("div");
        bubble.className = "velvora-audio-bubble " + (isUser ? "user" : "agent");

        const playBtn = document.createElement("button");
        playBtn.className = "velvora-play-btn";
        playBtn.innerHTML = velvoraPlayIcon();

        const track = document.createElement("div");
        track.className = "velvora-audio-track";
        const progress = document.createElement("div");
        progress.className = "velvora-audio-progress";
        track.appendChild(progress);

        const time = document.createElement("span");
        time.className = "velvora-audio-time";
        time.textContent = "0:00";

        bubble.appendChild(playBtn);
        bubble.appendChild(track);
        bubble.appendChild(time);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const audio = new Audio(audioUrl);
        let seeking = false;

        audio.addEventListener("loadedmetadata", () => {
            time.textContent = velvoraFormatTime(audio.duration);
        });
        audio.addEventListener("timeupdate", () => {
            if (seeking) return;
            const pct = (audio.currentTime / audio.duration) * 100 || 0;
            progress.style.width = pct + "%";
            time.textContent = velvoraFormatTime(audio.duration - audio.currentTime);
        });
        audio.addEventListener("ended", () => {
            playBtn.innerHTML = velvoraPlayIcon();
            progress.style.width = "0%";
            time.textContent = velvoraFormatTime(audio.duration);
        });

        playBtn.addEventListener("click", () => {
            if (audio.paused) {
                document.querySelectorAll("audio").forEach(a => { if (a !== audio) a.pause(); });
                audio.play();
                playBtn.innerHTML = velvoraPauseIcon();
            } else {
                audio.pause();
                playBtn.innerHTML = velvoraPlayIcon();
            }
        });

        track.addEventListener("click", (e) => {
            const rect = track.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            if (audio.duration) audio.currentTime = pct * audio.duration;
        });

        return row;
    }

    function velvoraPlayIcon() {
        return '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    }
    function velvoraPauseIcon() {
        return '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
    }

    function velvoraShowTyping(show) {
        let typingRow = document.getElementById("velvora-typing-row");
        const messagesEl = document.getElementById("velvora-chat-messages");
        if (show) {
            if (!typingRow) {
                typingRow = document.createElement("div");
                typingRow.className = "velvora-row agent";
                typingRow.id = "velvora-typing-row";
                typingRow.innerHTML = '<div id="velvora-typing"><span class="velvora-dot"></span><span class="velvora-dot"></span><span class="velvora-dot"></span></div>';
                messagesEl.appendChild(typingRow);
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        } else if (typingRow) {
            typingRow.remove();
        }
    }

    // --- Text sending ---
    async function velvoraSendMessage() {
        const inputEl = document.getElementById("velvora-chat-input");
        const text = inputEl.value.trim();
        if (!text) return;

        velvoraAddText(text, true);
        inputEl.value = "";
        velvoraShowTyping(true);

        try {
            const response = await fetch(VELVORA_API_BASE + "/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: velvoraSessionId, text: text }),
            });
            const data = await response.json();
            velvoraShowTyping(false);
            velvoraAddText(data.reply, false);
        } catch (error) {
            velvoraShowTyping(false);
            velvoraAddText("Sorry, something went wrong. Please try again.", false);
            console.error(error);
        }
    }

    document.getElementById("velvora-chat-input").addEventListener("keypress", function(e) {
        if (e.key === "Enter") velvoraSendMessage();
    });

    // --- Recording ---
    async function velvoraStartRecording() {
        try {
            velvoraRecStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
            velvoraAddText("Microphone access denied or unavailable.", false);
            console.error(err);
            return;
        }

        velvoraRecCancelled = false;
        velvoraAudioChunks = [];
        velvoraMediaRecorder = new MediaRecorder(velvoraRecStream);
        velvoraMediaRecorder.ondataavailable = (e) => velvoraAudioChunks.push(e.data);
        velvoraMediaRecorder.onstop = velvoraOnRecordingStopped;
        velvoraMediaRecorder.start();

        document.getElementById("velvora-chat-input-area").classList.add("hidden");
        document.getElementById("velvora-recording-bar").classList.add("active");

        velvoraRecSeconds = 0;
        document.getElementById("velvora-rec-timer").textContent = "0:00";
        velvoraRecTimerInterval = setInterval(() => {
            velvoraRecSeconds++;
            document.getElementById("velvora-rec-timer").textContent = velvoraFormatTime(velvoraRecSeconds);
        }, 1000);

        velvoraSetupBars();
        velvoraStartAmplitudeLoop();
    }

    function velvoraSetupBars() {
        const barsEl = document.getElementById("velvora-rec-bars");
        barsEl.innerHTML = "";
        for (let i = 0; i < VELVORA_BAR_COUNT; i++) {
            const bar = document.createElement("div");
            bar.className = "velvora-rec-bar";
            bar.style.height = "3px";
            barsEl.appendChild(bar);
        }
    }

    function velvoraStartAmplitudeLoop() {
        velvoraAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = velvoraAudioCtx.createMediaStreamSource(velvoraRecStream);
        velvoraAnalyser = velvoraAudioCtx.createAnalyser();
        velvoraAnalyser.fftSize = 64;
        source.connect(velvoraAnalyser);
        const dataArray = new Uint8Array(velvoraAnalyser.frequencyBinCount);
        const bars = document.querySelectorAll(".velvora-rec-bar");
        let barIndex = 0;

        function loop() {
            if (!velvoraMediaRecorder || velvoraMediaRecorder.state !== "recording") return;
            velvoraAnalyser.getByteFrequencyData(dataArray);
            const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
            const height = Math.max(3, Math.min(22, (avg / 255) * 22 + Math.random() * 3));
            bars[barIndex % bars.length].style.height = height + "px";
            barIndex++;
            requestAnimationFrame(loop);
        }
        loop();
    }

    function velvoraCancelRecording() {
        velvoraRecCancelled = true;
        if (velvoraMediaRecorder && velvoraMediaRecorder.state === "recording") {
            velvoraMediaRecorder.stop();
        }
    }

    function velvoraStopAndSendRecording() {
        velvoraRecCancelled = false;
        if (velvoraMediaRecorder && velvoraMediaRecorder.state === "recording") {
            velvoraMediaRecorder.stop();
        }
    }

    async function velvoraOnRecordingStopped() {
        clearInterval(velvoraRecTimerInterval);
        if (velvoraRecStream) velvoraRecStream.getTracks().forEach(t => t.stop());
        if (velvoraAudioCtx) velvoraAudioCtx.close();

        document.getElementById("velvora-recording-bar").classList.remove("active");
        document.getElementById("velvora-chat-input-area").classList.remove("hidden");

        if (velvoraRecCancelled) return;

        const audioBlob = new Blob(velvoraAudioChunks, { type: "audio/webm" });
        const localUrl = URL.createObjectURL(audioBlob);

        // Show the customer's own recording immediately, playable, so
        // they can confirm what they sent.
        velvoraAddAudioBubble(localUrl, true);
        velvoraShowTyping(true);

        const formData = new FormData();
        formData.append("audio", audioBlob, "voice.webm");

        try {
            const response = await fetch(
                VELVORA_API_BASE + "/api/chat/voice?session_id=" + velvoraSessionId,
                { method: "POST", body: formData }
            );
            const data = await response.json();
            velvoraShowTyping(false);

            if (data.error) {
                velvoraAddText("Sorry, I couldn't understand that voice message.", false);
                return;
            }

            // Confirm what was heard, so the customer knows it was
            // transcribed correctly.
            velvoraAddCaption('Heard: "' + data.transcribed_text + '"', true, document.querySelectorAll(".velvora-row.user")[document.querySelectorAll(".velvora-row.user").length - 1]);

            const replyAudioUrl = "data:audio/wav;base64," + data.reply_audio_base64;
            const replyRow = velvoraAddAudioBubble(replyAudioUrl, false);
            velvoraAddCaption(data.reply_text, false, replyRow);

        } catch (error) {
            velvoraShowTyping(false);
            velvoraAddText("Sorry, something went wrong with the voice message.", false);
            console.error(error);
        }
    }
</script>
</body>
</html>
